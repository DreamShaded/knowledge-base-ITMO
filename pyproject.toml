[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base"
version = "0.1.0"
description = "Semantic PKM: Obsidian vaults + PDF library → knowledge graph with hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "qdrant-client>=1.12",
    "pyoxigraph>=0.3",
    "rdflib>=7.0",
    "instructor>=1.6",
    "watchdog>=4.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "huggingface-hub>=0.24",
    "pyyaml>=6.0",
    "click>=8.1",
    "aiosqlite>=0.20",
    "anyio>=4.4",
    "sentence-transformers>=3.3",
    "fastembed>=0.4",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "transformers>=4.44",
    "torch>=2.3",
    "python-frontmatter>=1.1.0",
    "mistune>=3.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
pdf = [
    "pymupdf>=1.24",
    "marker-pdf>=1.6",
]
web = [
    "trafilatura>=1.12",
]
kge = [
    "pykeen>=1.10",
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "test-*.py"]
